<div class="admin-container">
  <!-- Mobile Topbar -->
  <header class="admin-mobile-header">
    <div class="brand">
      <span class="brand-icon"><img src="logo.svg" alt="Pearls & Petals logo" /></span>
      <span class="brand-title">Pearls & Petals</span>
      <span class="admin-badge">Admin</span>
    </div>
    <button
      type="button"
      class="mobile-menu-btn"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </header>

  <!-- Sidebar (Desktop & Mobile Drawer) -->
  <aside class="admin-sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-brand">
      <span class="brand-icon"><img src="logo.svg" alt="Pearls & Petals logo" /></span>
      <div class="brand-text">
        <h2>Pearls & Petals</h2>
        <span class="portal-tag">Admin Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        (click)="closeMobileMenu()"
        class="nav-item"
      >
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a
        routerLink="/admin/products"
        routerLinkActive="active"
        (click)="closeMobileMenu()"
        class="nav-item"
      >
        <span class="nav-icon">📦</span>
        <span class="nav-label">Products</span>
      </a>

      <a
        routerLink="/"
        (click)="closeMobileMenu()"
        class="nav-item view-store-link"
        target="_blank"
        rel="noopener"
      >
        <span class="nav-icon">🛍️</span>
        <span class="nav-label">View Store</span>
        <span class="external-icon">↗</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-user-info" *ngIf="(authService.user$ | async) as user">
        <span class="user-avatar">{{ user.email?.charAt(0)?.toUpperCase() || 'A' }}</span>
        <div class="user-details">
          <span class="user-email" [title]="user.email || ''">{{ user.email }}</span>
          <span class="user-role">Administrator</span>
        </div>
      </div>

      <button type="button" class="logout-btn" (click)="onLogout()">
        <span class="nav-icon">🚪</span>
        <span class="nav-label">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Mobile Overlay Backdrop -->
  <div
    *ngIf="isMobileMenuOpen"
    class="mobile-backdrop"
    (click)="closeMobileMenu()"
    aria-hidden="true"
  ></div>

  <!-- Main Content Area -->
  <main class="admin-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
