<header class="navbar-header">
  <div class="nav-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="brand-logo">
      <span class="brand-icon">
        <img src="logo.svg" alt="Pearls &amp; Petals logo" />
      </span>
      <span class="brand-text">Pearls &amp; Petals</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-links" [class.active]="isMenuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">Home</a>
      <a routerLink="/products" routerLinkActive="active" (click)="isMenuOpen = false">Collections</a>
      <a routerLink="/category/necklaces" routerLinkActive="active" (click)="isMenuOpen = false">Necklaces</a>
      <a routerLink="/category/earrings" routerLinkActive="active" (click)="isMenuOpen = false">Earrings</a>
    </nav>

    <!-- Nav Actions -->
    <div class="nav-actions">
      <!-- Search Button -->
      <button
        class="search-toggle"
        (click)="openSearch()"
        aria-label="Open search"
        id="btn-open-search"
        type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- Mobile Menu Hamburger -->
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle Navigation" type="button">
        <span class="bar" [class.open]="isMenuOpen"></span>
        <span class="bar" [class.open]="isMenuOpen"></span>
        <span class="bar" [class.open]="isMenuOpen"></span>
      </button>
    </div>
  </div>
</header>

<!-- Search Overlay -->
<app-search
  *ngIf="isSearchOpen"
  (closeSearch)="closeSearch()">
</app-search>
